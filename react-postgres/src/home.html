<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>

<style>
  table {
    width: 80%;
    border-collapse: collapse;
    margin: 20px auto;
  }

  th, td {
    border: 1px solid #dddddd;
    padding: 8px;
    text-align: left;
  }

  th {
    background-color: #dddddd;
  }

  ul {
    list-style-type: square;
    margin: 0;
    padding: 0;
  }

  li {
    display: inline-block;
    margin-right: 20px;
  }

  button {
    display: block;
    margin: 20px auto;
    padding: 8px 16px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>








<body>
<table>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Department Name</th>
    <th>Credits</th>
    <th>Courses Taken</th>
  </tr>
  <tr>
    <td>123456</td>
    <td>John Doe</td>
    <td>Computer Science</td>
    <td>120</td>
    <td>
      <ul>
        <li>Introduction to Computer Science</li>
        <li>Algorithms and Data Structures</li>
        <li>Programming in Python</li>
      </ul>
    </td>
  </tr>
</table>

<button>Logout</button>



</body>
</html>
